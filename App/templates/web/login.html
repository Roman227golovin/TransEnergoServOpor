{% extends "web/base.html" %}
{% block title %}Вход — Опоры Трансэнерго{% endblock %}
{% block body %}
<h1>Вход</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <label>Логин<br><input type="text" name="username" required autofocus></label>
  <label>Пароль<br><input type="password" name="password" required></label>
  <button type="submit">Войти</button>
</form>
{% endblock %}
